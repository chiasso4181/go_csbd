<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avvio Applicativo Locale</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #f8fafc;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 32px; width: 480px; max-width: 92vw;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 { margin: 0 0 22px 0; font-size: 22px; color: #38bdf8; }
    .btn {
      width: 100%; padding: 15px 16px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-blue:hover { background: #1d4ed8; }
    .hint {
      font-size: 13px; color: #94a3b8; margin-top: 14px;
      line-height: 1.5; white-space: pre-line;
    }
    .privacy-badge {
      margin-top: 20px; padding-top: 14px; border-top: 1px solid #334155;
      font-size: 11.5px; color: #64748b; line-height: 1.4;
    }
    .reset-link {
      display: inline-block; margin-top: 12px; font-size: 12px;
      color: #64748b; cursor: pointer; text-decoration: underline;
    }
    #log {
      margin-top: 12px; font-family: monospace; font-size: 12px; text-align: left;
      color: #fca5a5; white-space: pre-wrap; max-height: 180px; overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 id="ui-title">🚀 Avvio Applicativo</h2>
  <button id="btn-main" class="btn btn-blue">Caricamento...</button>
  <div class="hint" id="ui-hint"></div>
  <div id="log"></div>
  <span class="reset-link" id="btn-reset" style="display:none;">⚙️ Riconfigura cartella</span>
  <div class="privacy-badge">
    🔒 <strong>Esecuzione 100% locale</strong>: questa pagina funge solo da ponte di avvio.<br>
    Applicativi e database restano esclusivamente sul disco di rete interno.
  </div>
</div>

<script>
window.onerror = function(msg, url, line) {
  var log = document.getElementById('log');
  if (log) log.textContent += '❌ ' + msg + ' (riga ' + line + ')\n';
};
</script>

<script>
const DB_NAME = 'DualPathBootloaderDB';
const STORE_NAME = 'handles';

const uiTitle  = document.getElementById('ui-title');
const uiHint   = document.getElementById('ui-hint');
const btnMain  = document.getElementById('btn-main');
const btnReset = document.getElementById('btn-reset');
const logEl    = document.getElementById('log');

function logErr(msg) { logEl.textContent += msg + '\n'; }

/** Legge i parametri da ? o #, li salva nella scheda corrente e pulisce subito la barra indirizzi. */
function getMergedParams() {
  const hasSearch = location.search && location.search.length > 1;
  const hasHash   = location.hash && location.hash.includes('=');

  if (hasSearch || hasHash) {
    const merged = new URLSearchParams(hasSearch ? location.search.slice(1) : '');
    if (hasHash) {
      const hs = new URLSearchParams(location.hash.slice(1));
      for (const [k, v] of hs.entries()) merged.set(k, v);
    }
    try {
      sessionStorage.setItem('__BOOT_PARAMS__', merged.toString());
      const cleanUrl = merged.get('user')
        ? location.pathname + '?user=' + encodeURIComponent(merged.get('user'))
        : location.pathname;
      history.replaceState(null, '', cleanUrl);
    } catch (_) {}
    return merged;
  }

  try {
    const saved = sessionStorage.getItem('__BOOT_PARAMS__');
    if (saved) return new URLSearchParams(saved);
  } catch (_) {}

  return new URLSearchParams();
}

const params = getMergedParams();

function pVal(...keys) {
  for (const k of keys) {
    const v = params.get(k);
    if (v !== null && v.trim() !== '') return v.trim();
  }
  return '';
}

function pFlag(...keys) {
  const v = pVal(...keys).toLowerCase();
  return v === '1' || v === 'true' || v === 'yes' || v === 'si';
}

function normalizzaPercorso(p) {
  if (!p) return '';
  let s = p.trim().replace(/\//g, '\\');
  if (/^\\[^\\]/.test(s) && !s.startsWith('\\\\')) s = '\\' + s;
  return s;
}

function hashBreve(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h).toString(36);
}

function buildConfig() {
  const rawApp  = pVal('app', 'a').toLowerCase();
  const fileHtml = pVal('html', 'file', 'h');
  const pathPlain = normalizzaPercorso(pVal('path', 'cartella', 'p'));
  const rawDb   = pVal('db', 'd');
  const dbRegexStr = pVal('db_regex', 'dr');
  const titolo  = pVal('titolo', 'title', 't');
  const scritturaDiretta = pFlag('direct', 'scritturaDiretta', 'w');
  const fullscreen = pFlag('fs', 'fullscreen');
  const exitUrl = pVal('exit', 'uscita') || 'about:blank';

  if (!fileHtml) {
    return {
      appKey: '',
      CFG: null,
      err: 'Apri l\'applicativo tramite il relativo collegamento (.url) presente nella cartella di rete.'
    };
  }

  let appKey = rawApp;
  if (!appKey) {
    const slug = fileHtml.replace(/\.[^.]+$/, '').replace(/[^a-z0-9]+/gi, '_').toLowerCase().replace(/^_|_$/g, '') || 'app';
    appKey = pathPlain ? slug + '_' + hashBreve(pathPlain.toLowerCase()) : slug;
  }

  const dbCandidati = rawDb ? rawDb.split(',').map(s => s.trim()).filter(Boolean) : [];
  let dbAlternativo = null;
  if (dbRegexStr) {
    try { dbAlternativo = new RegExp(dbRegexStr, 'i'); } catch (_) {}
  }

  const cleanDefaultTitle = fileHtml.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');

  return {
    appKey,
    CFG: {
      titolo: titolo || cleanDefaultTitle,
      fileHtml,
      dbCandidati,
      dbAlternativo,
      percorsoPlain: pathPlain,
      scritturaDiretta,
      fullscreen,
      exitUrl
    },
    err: null
  };
}

const { appKey, CFG, err: cfgErr } = buildConfig();

if (cfgErr || !CFG) {
  uiTitle.textContent = 'ℹ️ Collegamento richiesto';
  btnMain.style.display = 'none';
  uiHint.textContent = cfgErr;
  throw new Error('Avvio diretto senza shortcut');
}

uiTitle.textContent = '🚀 ' + CFG.titolo;
document.title = CFG.titolo;

function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function getHandle(key) {
  try {
    const db = await openIDB();
    return await new Promise(res => {
      const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(key);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch (_) {
    return null;
  }
}

async function setHandle(key, handle) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(handle, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function clearHandles() {
  const db = await openIDB();
  const tx = db.transaction(STORE_NAME, 'readwrite');
  tx.objectStore(STORE_NAME).delete(appKey + '_code');
  tx.objectStore(STORE_NAME).delete(appKey + '_db');
}

async function readCodeFile(codeDirHandle, relPath) {
  const clean = decodeURIComponent(relPath.split('?')[0].split('#')[0]).replace(/^\.\//, '');
  const parts = clean.split(/[/\\]/).filter(Boolean);
  let curr = codeDirHandle;
  for (let i = 0; i < parts.length - 1; i++) {
    curr = await curr.getDirectoryHandle(parts[i]);
  }
  const fh = await curr.getFileHandle(parts[parts.length - 1]);
  return await (await fh.getFile()).text();
}

async function trovaDatabaseAlternativo(codeDirHandle) {
  if (!CFG.dbAlternativo) return null;
  const trovati = [];
  try {
    for await (const voce of codeDirHandle.values()) {
      if (voce.kind === 'file' && CFG.dbAlternativo.test(voce.name)) trovati.push(voce);
    }
  } catch (_) {}
  if (trovati.length === 1) return trovati[0];
  if (trovati.length > 1) {
    logErr('⚠️ Più database compatibili nella cartella (' + trovati.map(h => h.name).join(', ') + ').');
  }
  return null;
}

/* ==================== GESTIONE SCHERMO INTERO E USCITA PULITA ==================== */
let entratoInFullscreen = false;
let pausaUscitaFs = false;
let chiusuraInCorso = false;

function sospendiUscitaFs() {
  pausaUscitaFs = true;
  setTimeout(() => { pausaUscitaFs = false; }, 3000);
}

function chiudiApplicativo() {
  if (chiusuraInCorso) return;
  chiusuraInCorso = true;

  try { sessionStorage.removeItem('__BOOT_PARAMS__'); } catch (_) {}
  try {
    if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
  } catch (_) {}
  try {
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  } catch (_) {}
  try {
    document.documentElement.style.background = '#0f172a';
    if (document.body) document.body.innerHTML = '';
  } catch (_) {}

  // 1. Tenta chiusura fisica della scheda
  try { window.open('', '_self'); window.close(); } catch (_) {}
  try { window.close(); } catch (_) {}

  // 2. Fallback immediato (60ms) per schede aperte da .url: elimina l'URL di GitHub
  setTimeout(() => {
    window.location.replace(CFG.exitUrl || 'about:blank');
  }, 60);
}

function richiediFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el && el.requestFullscreen) {
    return el.requestFullscreen().then(() => {
      if (navigator.keyboard && navigator.keyboard.lock) {
        navigator.keyboard.lock(['Escape']).catch(() => {});
      }
    });
  }
  return Promise.resolve();
}

function iniettaBottoneEsci() {
  if (chiusuraInCorso || !document.body) return;

  if (document.head && !document.getElementById('__bl_exit_style__')) {
    const st = document.createElement('style');
    st.id = '__bl_exit_style__';
    st.textContent = '@media print { #__bl_exit_btn__ { display: none !important; } }';
    document.head.appendChild(st);
  }

  if (document.getElementById('__bl_exit_btn__')) return;
  const btn = document.createElement('button');
  btn.id = '__bl_exit_btn__';
  btn.type = 'button';
  btn.textContent = '✕ Esci';
  btn.title = 'Chiudi applicativo';
  btn.style.cssText = [
    'position:fixed', 'top:0', 'right:0', 'z-index:2147483647',
    'background:rgba(15,23,42,0.6)', 'color:#e2e8f0',
    'border:none', 'border-bottom-left-radius:8px',
    'padding:5px 12px', 'font:600 11.5px/1.2 system-ui,sans-serif',
    'cursor:pointer', 'backdrop-filter:blur(4px)',
    'transition:background .15s,opacity .15s', 'opacity:0.55'
  ].join(';');
  btn.onmouseenter = () => { btn.style.background = '#dc2626'; btn.style.color = '#fff'; btn.style.opacity = '1'; };
  btn.onmouseleave = () => { btn.style.background = 'rgba(15,23,42,0.6)'; btn.style.color = '#e2e8f0'; btn.style.opacity = '0.55'; };
  btn.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    chiudiApplicativo();
  };
  document.body.appendChild(btn);
}

function attivaFullscreen() {
  if (!CFG || !CFG.fullscreen) return;

  // Intercetta stampe, finestre file e download per non chiudere l'app quando Edge esce dal fullscreen
  if (typeof window.print === 'function') {
    const origPrint = window.print;
    window.print = function(...args) {
      sospendiUscitaFs();
      return origPrint.apply(this, args);
    };
  }
  for (const fnName of ['showOpenFilePicker', 'showSaveFilePicker', 'showDirectoryPicker']) {
    if (typeof window[fnName] === 'function') {
      const origFn = window[fnName];
      window[fnName] = function(...args) {
        sospendiUscitaFs();
        return origFn.apply(this, args);
      };
    }
  }
  if (typeof window.open === 'function') {
    const origOpen = window.open;
    window.open = function(...args) {
      if (args[0] !== '') sospendiUscitaFs();
      return origOpen.apply(this, args);
    };
  }
  const origInputClick = HTMLInputElement.prototype.click;
  HTMLInputElement.prototype.click = function(...args) {
    if (this.type === 'file') sospendiUscitaFs();
    return origInputClick.apply(this, args);
  };
  const origAnchorClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(...args) {
    if (this.hasAttribute('download')) sospendiUscitaFs();
    return origAnchorClick.apply(this, args);
  };
  window.addEventListener('keydown', (e) => {
    const k = (e.key || '').toLowerCase();
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (k === 'r' || k === 'p'))) {
      sospendiUscitaFs();
    }
  }, true);

  // Aggiunge il pulsante ✕ Esci e lo mantiene se l'app riscrive il body
  iniettaBottoneEsci();
  if (document.body) {
    const obs = new MutationObserver(() => iniettaBottoneEsci());
    obs.observe(document.body, { childList: true });
  }

  // Intercetta l'uscita con la X in alto di Edge
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      entratoInFullscreen = true;
      pausaUscitaFs = false;
    } else if (entratoInFullscreen) {
      if (pausaUscitaFs) {
        entratoInFullscreen = false;
        pausaUscitaFs = false;
        window.addEventListener('click', () => {
          if (!chiusuraInCorso) richiediFullscreen().catch(() => {});
        }, { once: true, capture: true });
      } else {
        chiudiApplicativo();
      }
    }
  });

  // Avvia lo schermo intero (con fallback al 1° clic se il popup di Edge interrompe il gesto)
  try {
    Promise.resolve(richiediFullscreen()).catch(() => {
      window.addEventListener('click', () => {
        if (!chiusuraInCorso) {
          try { Promise.resolve(richiediFullscreen()).catch(() => {}); } catch (_) {}
        }
      }, { once: true, capture: true });
    });
  } catch (_) {}
}
/* ================================================================================= */

async function startApp(codeDirHandle) {
  try {
    logEl.textContent = '';

    const permCode = await codeDirHandle.requestPermission({ mode: 'readwrite' });
    if (permCode !== 'granted') {
      logErr('❌ Consenso negato. Clicca "Modifica file" nel messaggio di Edge.');
      return;
    }

    let dbHandle = null;
    for (const nomeFile of CFG.dbCandidati) {
      try {
        dbHandle = await codeDirHandle.getFileHandle(nomeFile, { create: false });
        break;
      } catch (_) {}
    }
    if (!dbHandle) dbHandle = await trovaDatabaseAlternativo(codeDirHandle);

    window.__BOOTLOADER_DIR_HANDLE__ = codeDirHandle;
    window.__BOOTLOADER_DB_HANDLE__  = dbHandle;
    window.__BOOTLOADER_PARAMS__     = Object.fromEntries(params.entries());
    window.BOOTLOADER_ACTIVE         = true;
    window.bootloaderDirHandle       = codeDirHandle;
    window.bootloaderFileHandle      = dbHandle;
    window.dbFileHandle              = dbHandle;

    let rawHtml;
    try {
      rawHtml = await readCodeFile(codeDirHandle, CFG.fileHtml);
    } catch (e) {
      if (e && e.name === 'NotFoundError') {
        logErr('❌ «' + CFG.fileHtml + '» non trovato nella cartella collegata (' + (codeDirHandle.name || '?') + ').\n' +
               'Verifica lo shortcut oppure clicca «Riconfigura cartella».');
        return;
      }
      throw e;
    }

    if (CFG.scritturaDiretta) {
      document.open();
      document.write(rawHtml);
      document.close();
      attivaFullscreen();
      return;
    }

    const doc = new DOMParser().parseFromString(rawHtml, 'text/html');

    for (const attr of Array.from(doc.documentElement.attributes)) {
      document.documentElement.setAttribute(attr.name, attr.value);
    }

    const headNodes = Array.from(doc.head.querySelectorAll('link[rel="stylesheet"], link[rel="icon"], style'));
    document.head.innerHTML = '';
    document.title = doc.title || CFG.titolo;

    for (const node of headNodes) {
      if (node.tagName === 'STYLE') {
        const st = document.createElement('style');
        st.textContent = node.textContent;
        document.head.appendChild(st);
      } else if (node.tagName === 'LINK') {
        const rel  = node.getAttribute('rel');
        const href = node.getAttribute('href');
        if (!href) continue;
        if (rel === 'icon' || href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//') || href.startsWith('data:')) {
          const lnk = document.createElement('link');
          for (const a of Array.from(node.attributes)) lnk.setAttribute(a.name, a.value);
          document.head.appendChild(lnk);
        } else {
          const cssText = await readCodeFile(codeDirHandle, href);
          const st = document.createElement('style');
          st.textContent = cssText + '\n/*# sourceURL=' + href.split('?')[0] + ' */';
          document.head.appendChild(st);
        }
      }
    }

    const scripts = [
      ...Array.from(doc.head.querySelectorAll('script')),
      ...Array.from(doc.body.querySelectorAll('script'))
    ];
    doc.body.querySelectorAll('script').forEach(s => s.remove());
    document.body.className = doc.body.className;
    document.body.style.cssText = doc.body.style.cssText;
    document.body.innerHTML = doc.body.innerHTML;

    for (const oldScript of scripts) {
      const src = oldScript.getAttribute('src');
      const s = document.createElement('script');
      for (const a of Array.from(oldScript.attributes)) {
        if (a.name !== 'src' && a.name !== 'defer' && a.name !== 'async') {
          s.setAttribute(a.name, a.value);
        }
      }
      if (!src) {
        s.textContent = oldScript.textContent;
        document.body.appendChild(s);
      } else if (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('//')) {
        await new Promise((res, rej) => {
          s.src = src;
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      } else {
        const cleanSrc = src.split('?')[0];
        const jsCode = await readCodeFile(codeDirHandle, src);
        s.textContent = jsCode + '\n//# sourceURL=' + cleanSrc;
        document.body.appendChild(s);
      }
    }

    const bodyOnload = doc.body.getAttribute('onload');
    if (bodyOnload) {
      try { new Function(bodyOnload)(); } catch (e) { console.error(e); }
    }

    document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    window.dispatchEvent(new Event('load'));
    attivaFullscreen();

  } catch (err) {
    logErr('❌ Errore durante l\'avvio: ' + err.message);
    console.error(err);
  }
}

async function refreshUI() {
  const codeHandle = await getHandle(appKey + '_code');

  if (codeHandle) {
    btnMain.className = 'btn btn-green';
    btnMain.textContent = '▶️ AVVIA ' + CFG.titolo.toUpperCase();
    uiHint.textContent = 'Clicca il pulsante verde e conferma "Modifica file" nel messaggio di Edge.';
    btnReset.style.display = 'inline-block';
    btnMain.onclick = () => startApp(codeHandle);
  } else {
    btnMain.className = 'btn btn-blue';
    btnMain.textContent = '🔗 COLLEGA APPLICATIVO (1ª VOLTA)';
    uiHint.textContent = CFG.percorsoPlain
      ? 'Clicca il pulsante, premi Ctrl+V + Invio nella finestra\ne clicca "Seleziona cartella".'
      : 'Clicca il pulsante, naviga fino alla cartella di rete dell\'applicativo\ne clicca "Seleziona cartella".';
    btnReset.style.display = 'none';
    btnMain.onclick = async () => {
      try {
        if (CFG.percorsoPlain) {
          await navigator.clipboard.writeText(CFG.percorsoPlain).catch(() => {});
        }
        const h = await window.showDirectoryPicker({ mode: 'readwrite' });
        await setHandle(appKey + '_code', h);
        await refreshUI();
        await startApp(h);
      } catch (e) {
        if (e.name !== 'AbortError') logErr('❌ ' + e.message);
      }
    };
  }
}

btnReset.onclick = async () => {
  await clearHandles();
  await refreshUI();
};

refreshUI();
</script>
</body>
</html>
